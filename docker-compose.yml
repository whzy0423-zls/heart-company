# 三容器编排：Go server + 后台管理(web-antd) + 官网(website-react)
# 在仓库根 nine-xing/ 下执行：docker compose up -d --build
#
# 端口（宿主机:容器）：
#   后台管理 http://localhost:8080
#   官网     http://localhost:8000
#   Go server 仅集群内访问（不对外暴露，经各 nginx 反代 /api）

services:
  db:
    # pgvector 镜像 = postgres16 + vector 扩展，向量检索需要；
    # 退回普通 postgres:16-alpine 也能跑（schema 会自动跳过向量部分）。
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-nx_admin}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nx} -d ${POSTGRES_DB:-nx_admin}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - nx

  server:
    build:
      context: .
      dockerfile: nx-backend/apps/server/Dockerfile
    restart: unless-stopped
    stop_grace_period: 330s
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: "5320"
      APP_ENV: ${APP_ENV:-production}
      SITE_CONFIG_PATH: /data/site-config.json
      ADMIN_CONFIG_PATH: /data/admin-config.json
      DATABASE_URL: postgres://${POSTGRES_USER:-nx}:${POSTGRES_PASSWORD:-nx}@db:5432/${POSTGRES_DB:-nx_admin}?sslmode=disable
      DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-20}
      DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:-5}
      # 生产务必改成强随机串与你自己的账号密码（首次启动播种管理员）
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      # compose 固定 nx 网络为 172.28.0.0/24；只信任该内置 nginx 网段转发的真实客户端 IP。
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-172.28.0.0/24}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
      OSS_BUCKET: ${OSS_BUCKET:-}
      OSS_ENDPOINT: ${OSS_ENDPOINT:-}
      OSS_REGION: ${OSS_REGION:-}
      OSS_PUBLIC_URL: ${OSS_PUBLIC_URL:-}
      OSS_PREFIX: ${OSS_PREFIX:-uploads}
      UPLOAD_MAX_MB: ${UPLOAD_MAX_MB:-20}
      UPLOAD_DIR: /data/uploads
      APP_RELEASE_PACKAGE_NAME: ${APP_RELEASE_PACKAGE_NAME:-com.xinzhili.nine_xing_app}
      APP_RELEASE_CERT_SHA256: ${APP_RELEASE_CERT_SHA256:-}
      XINZHILI_SECRET_KEY: ${XINZHILI_SECRET_KEY:-}
      XINZHILI_TTS_MAX_CONCURRENT: ${XINZHILI_TTS_MAX_CONCURRENT:-8}
      XINZHILI_MAX_CONNECTIONS: ${XINZHILI_MAX_CONNECTIONS:-50}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      MINIMAX_GROUP_ID: ${MINIMAX_GROUP_ID:-}
      MINIMAX_API_BASE: ${MINIMAX_API_BASE:-https://api.minimaxi.com}
      # 微信小程序：填了 AppID/Secret 走真实登录；留空则用本地 dev 登录回退
      WECHAT_APPID: ${WECHAT_APPID:-}
      WECHAT_SECRET: ${WECHAT_SECRET:-}
      WECHAT_LOGIN_DEV: ${WECHAT_LOGIN_DEV:-}
      SMS_PROVIDER: ${SMS_PROVIDER:-}
      SMS_API_KEY: ${SMS_API_KEY:-}
      SMS_API_SECRET: ${SMS_API_SECRET:-}
      SMS_SIGN_NAME: ${SMS_SIGN_NAME:-}
      SMS_TEMPLATE_ID: ${SMS_TEMPLATE_ID:-}
      SPUG_PUSH_API_BASE: ${SPUG_PUSH_API_BASE:-https://push.spug.cc}
      SPUG_PUSH_TEMPLATE_CODE: ${SPUG_PUSH_TEMPLATE_CODE:-}
      SPUG_PUSH_TEMPLATE_NAME: ${SPUG_PUSH_TEMPLATE_NAME:-芯之力}
      SPUG_PUSH_TIMEOUT_SECONDS: ${SPUG_PUSH_TIMEOUT_SECONDS:-10}
      WXPAY_MCH_ID: ${WXPAY_MCH_ID:-}
      WXPAY_APPID: ${WXPAY_APPID:-}
      WXPAY_API_V3_KEY: ${WXPAY_API_V3_KEY:-}
      WXPAY_SERIAL_NO: ${WXPAY_SERIAL_NO:-}
      WXPAY_PRIVATE_KEY_PATH: ${WXPAY_PRIVATE_KEY_PATH:-/run/secrets/wxpay/apiclient_key.pem}
      WXPAY_PLATFORM_CERT_PATH: ${WXPAY_PLATFORM_CERT_PATH:-/run/secrets/wxpay/wechatpay_platform.pem}
      WXPAY_NOTIFY_URL: ${WXPAY_NOTIFY_URL:-}
      WXPAY_REPORT_PRICE_CENTS: ${WXPAY_REPORT_PRICE_CENTS:-990}
      WXPAY_DEV: ${WXPAY_DEV:-}
      VIDEO_API_BASE: ${VIDEO_API_BASE:-}
      VIDEO_API_KEY: ${VIDEO_API_KEY:-}
      VIDEO_MODEL: ${VIDEO_MODEL:-}
      VIDEO_TIMEOUT_SECONDS: ${VIDEO_TIMEOUT_SECONDS:-120}
      IMAGE_API_BASE: ${IMAGE_API_BASE:-}
      IMAGE_API_KEY: ${IMAGE_API_KEY:-}
      IMAGE_MODEL: ${IMAGE_MODEL:-}
      IMAGE_TIMEOUT_SECONDS: ${IMAGE_TIMEOUT_SECONDS:-120}
      ASR_API_BASE: ${ASR_API_BASE:-https://api.siliconflow.cn}
      ASR_API_KEY: ${ASR_API_KEY:-}
      ASR_MODEL: ${ASR_MODEL:-FunAudioLLM/SenseVoiceSmall}
      ASR_TIMEOUT_SECONDS: ${ASR_TIMEOUT_SECONDS:-60}
      JPUSH_APP_KEY: ${JPUSH_APP_KEY:-}
      JPUSH_MASTER_SECRET: ${JPUSH_MASTER_SECRET:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-}
      EMBEDDING_API_BASE: ${EMBEDDING_API_BASE:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1536}
      # 容器化下官网走运行时 fetch，不在容器内自动构建官网，故留空
      BUILD_SCRIPT: ""
    volumes:
      # 站点配置持久化，后台保存后重启不丢
      - site-config:/data
      # 未配置 OSS 时，上传文件保存到这里，重启不丢
      - uploads:/data/uploads
      # 微信支付证书建议放在宿主机 ./certs/wxpay 下，并在 .env 中引用 /run/secrets/wxpay/*.pem
      - ./certs/wxpay:/run/secrets/wxpay:ro
    networks:
      - nx

  admin:
    build:
      context: .
      dockerfile: nx-backend/apps/web-antd/Dockerfile
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - nx

  website:
    build:
      context: .
      dockerfile: website-react/Dockerfile
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "127.0.0.1:8000:80"
    networks:
      - nx

volumes:
  site-config:
  pgdata:
  uploads:

networks:
  nx:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
