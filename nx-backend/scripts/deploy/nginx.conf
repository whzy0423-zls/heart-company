worker_processes 1;

events {
  worker_connections 1024;
}

http {
  include mime.types;
  default_type application/octet-stream;
  client_max_body_size 50m;

  types {
    application/javascript js mjs;
    text/css               css;
    text/html              html;
  }

  sendfile on;
  keepalive_timeout 65;

  gzip on;
  gzip_min_length 1k;
  gzip_comp_level 6;
  gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
  gzip_vary on;

  # Go server 容器（compose 服务名 server，端口 5320）
  upstream backend {
    server server:5320;
  }

  server {
    listen 8080;
    server_name _;

    # 后台静态资源
    location / {
      root /usr/share/nginx/html;
      try_files $uri $uri/ /index.html;
      index index.html;
    }

    location = /api/app-releases/upload {
      client_max_body_size 301m;
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_request_buffering off;
      proxy_connect_timeout 30s;
      proxy_read_timeout 1800s;
      proxy_send_timeout 1800s;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/public/app-release/download {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_buffering off;
      proxy_cache off;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/app/xinzhili/realtime {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_buffering off;
      proxy_request_buffering off;
      gzip off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      access_log off;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/public/app-releases/[0-9]+/download$ {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_buffering off;
      proxy_cache off;
      proxy_set_header Range $http_range;
      proxy_set_header If-Range $http_if_range;
      proxy_force_ranges on;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # App 对话 SSE：关闭代理缓冲与压缩，收到模型增量后立即转发。
    location ^~ /api/app/chat/ {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_cache off;
      gzip off;
      proxy_connect_timeout 30s;
      proxy_read_timeout 180s;
      proxy_send_timeout 180s;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 技能独立会话 SSE：关闭代理缓冲与压缩，逐条转发回答增量。
    location ~ ^/api/app/skill-sessions/[^/]+/ask/stream$ {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_cache off;
      gzip off;
      proxy_connect_timeout 30s;
      proxy_read_timeout 180s;
      proxy_send_timeout 180s;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 芯之力语音上传 + SSE：边上传边转发，并立即透传响应增量。
    location = /api/app/xinzhili/turns/stream {
      client_max_body_size 11m;
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_cache off;
      gzip off;
      proxy_connect_timeout 30s;
      proxy_read_timeout 180s;
      proxy_send_timeout 180s;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 接口反代到 Go server
    location /api/ {
      proxy_pass http://backend;
      proxy_connect_timeout 30s;
      proxy_read_timeout 180s;
      proxy_send_timeout 180s;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
      root /usr/share/nginx/html;
    }
  }
}
